name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Format, Lint, Test, Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v3-${{ runner.os }}-validate-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-validate-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-

      - name: Cache cargo-audit binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1

      - name: Install cargo audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      # The default `playback` feature (rodio/cpal) links against ALSA on Linux.
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      # The `Test` step above is the authoritative behavioral run. libtest
      # exits 0 when a `-- <filter>` matches nothing, so a renamed or deleted
      # security-regression test can vanish silently; this single `--list`
      # invocation (never per-test) proves every required test still exists
      # exactly once. The required manifest lives in
      # scripts/ci/verify_regressions.py and is unit-tested.
      - name: Verify security regression coverage
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --list > /tmp/regression-tests.txt
          python3 scripts/ci/verify_regressions.py /tmp/regression-tests.txt

      - name: Audit dependencies
        # Gate on the `unmaintained` and `unsound` advisory categories. The
        # `yanked` check is intentionally NOT denied: the only yanked crates
        # (js-sys/wasm-bindgen/core2) are wasm-only transitive deps of reqwest
        # that we never compile for the Linux server target and cannot be
        # bumped without a newer reqwest.
        # Per-advisory exceptions (e.g. the `gui`/GTK3 tree) live in
        # .cargo/audit.toml so any NEW advisory on a crate we depend on still
        # fails the build.
        run: cargo audit --deny unmaintained --deny unsound

  build:
    name: Build release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v3-${{ runner.os }}-build-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-build-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-

      # Install ALSA for audio playback feature (server-side queue)
      - name: Install ALSA development libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # GPU-accelerated builds (`--features cuda`/`rocm`/`coreml`) require the
      # respective SDKs/toolchains and are validated locally, not in CI.
      - name: Build release
        run: cargo build --release --locked

  # Verify the headless network-server build (no ALSA dependency).
  build-headless:
    name: Build headless (no playback)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v3-${{ runner.os }}-build-headless-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-build-headless-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-

      - name: Build release (headless server)
        run: cargo build --release --locked --no-default-features --features server

      - name: Clippy (headless server)
        run: cargo clippy --locked --no-default-features --features server --all-targets -- -D warnings

      - name: Test (headless server)
        run: cargo test --locked --no-default-features --features server

  # Linux-compatible feature combinations beyond default/headless.
  feature-matrix:
    name: Feature matrix (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - features: ""
            args: --no-default-features
          - features: tiktools-plugin
            args: --no-default-features --features tiktools-plugin
          - features: qwen-gguf
            args: --no-default-features --features qwen-gguf
          - features: server,pocket-tts
            args: --no-default-features --features server,pocket-tts
          - features: server,qwen-gguf,pocket-tts
            args: --no-default-features --features server,qwen-gguf,pocket-tts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Check ${{ matrix.features }}
        run: cargo check --locked ${{ matrix.args }} --all-targets
      - name: Test server provider feature combinations
        if: contains(matrix.features, 'server')
        run: cargo test --locked ${{ matrix.args }}
      - name: Clippy server provider feature combinations
        if: contains(matrix.features, 'server')
        run: cargo clippy --locked ${{ matrix.args }} --all-targets -- -D warnings

  # Native GGUF/ONNX backend (opt-in feature, CPU llama.cpp build).
  # Real-model and Vulkan hardware tests stay ignored/opt-in: this job
  # compiles the backend and runs the offline unit tests only.
  gguf:
    name: Native GGUF backend (qwen-gguf)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v3-${{ runner.os }}-gguf-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-gguf-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-

      - name: Clippy (qwen-gguf)
        run: cargo clippy --locked --no-default-features --features qwen-gguf --all-targets -- -D warnings

      - name: Unit tests (qwen-gguf, offline)
        run: cargo test --locked --no-default-features --features qwen-gguf --lib

  vulkan:
    name: Native Vulkan backend (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        run: python3 scripts/ci/preflight.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install Vulkan SDK build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libvulkan-dev vulkan-tools glslc spirv-headers
      - name: Compile and test explicit Vulkan backend (no GPU inference)
        run: cargo test --locked --no-default-features --features qwen-gguf-vulkan --lib

  # The desktop tray on Linux is pure-Rust StatusNotifierItem (ksni): no GTK
  # system libraries are needed. Never reintroduce a GTK build dependency.
  build-gui:
    name: GUI tests and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      KNF_STATIC_CRT: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: sonicboom-linux-x86_64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: sonicboom-windows-x86_64.zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test archive and checksum guards
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v3-${{ runner.os }}-gui-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-${{ github.sha }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-gui-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**') }}-

      - name: Install pinned Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-vulkan.ps1

      - name: Install ALSA development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev libopus-dev pkg-config cmake clang g++ libvulkan-dev vulkan-tools glslc spirv-headers

      - name: Linux GUI graph must not contain glib
        if: runner.os == 'Linux'
        run: |
          set -e
          if cargo tree --locked --features gui,qwen-gguf-vulkan --target x86_64-unknown-linux-gnu -i glib 2>/dev/null | grep -q 'glib v'; then
            echo "ERROR: glib present in Linux GUI dependency graph" >&2
            exit 1
          fi
          echo "OK: no glib in Linux GUI graph"

      - name: Clippy (GUI)
        run: cargo clippy --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }} --all-targets -- -D warnings

      # ort/copy-dylibs can copy only beside the profile root when Windows
      # symlinks are unavailable (cache and checkout live on different drives).
      # Tests/examples must still resolve those DLLs without disabling tests.
      - name: Make Cargo-copied DLLs available to Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ github.workspace }}/target/${{ matrix.target }}/debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Test (GUI)
        run: cargo test --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }}

      - name: Build release (GUI)
        run: cargo build --release --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }}

      - name: Package release binary (case-sensitive existence check)
        run: python scripts/release/package.py --target ${{ matrix.target }}

      - name: Verify native runtime, health and graceful shutdown
        run: python scripts/release/smoke.py dist/${{ matrix.asset }}

  docker-cpu:
    name: Docker CPU build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py

      - name: Build default (headless CPU) image
        run: docker build -t sonicboom:test .

      - name: Build explicit runtime target
        run: docker build --target runtime -t sonicboom:cpu .

      - name: Verify image runs as non-root
        run: |
          USER="$(docker inspect sonicboom:cpu --format '{{.Config.User}}')"
          echo "image user: $USER"
          test "$USER" = "sonicboom"

      - name: Verify no unresolved shared libraries
        run: |
          docker run --rm --entrypoint /bin/sh sonicboom:cpu -c \
            'ldd /app/sonicboom | grep "not found" && exit 1 || echo "OK: ldd clean"'

      - name: Verify CPU health and graceful shutdown (model-free)
        run: python3 scripts/ci/container_smoke.py sonicboom:cpu

  docker-playback:
    name: Docker playback build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py

      - name: Build playback image
        run: docker build --target runtime-playback -t sonicboom:playback .

      - name: Verify non-root user and ALSA runtime
        run: |
          USER="$(docker inspect sonicboom:playback --format '{{.Config.User}}')"
          echo "image user: $USER"
          test "$USER" = "sonicboom"
          docker run --rm --entrypoint /bin/sh sonicboom:playback -c \
            'ldd /app/sonicboom | grep "not found" && exit 1 || echo "OK: ldd clean"'
          docker run --rm --entrypoint /bin/sh sonicboom:playback -c \
            'ldconfig -p | grep -q libasound || exit 1; echo "OK: ALSA present"'

      - name: Verify playback health and graceful shutdown (model-free)
        run: python3 scripts/ci/container_smoke.py sonicboom:playback

  # Fast, static validation only. The full ~80 minute CUDA Docker build is
  # deliberately NOT run on pushes/PRs; it lives in the dedicated
  # `cuda-full.yml` workflow (manual + scheduled + release tags).
  docker-cuda:
    name: Docker CUDA structural check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py

      # Static CUDA wiring only: features, Docker stages, pinned base images,
      # native CMake/NCCL policy and runtime packaging. Never invokes NVCC.
      - name: CUDA configuration check (static, no NVCC/Docker)
        run: python3 scripts/ci/cuda_structure.py

  dockerfile-lint:
    name: Dockerfile structure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py

      - name: Test CI script regressions
        run: python3 -m unittest discover -s scripts/ci

      - name: Validate Dockerfile security structure
        run: |
          set -e
          # CUDA stage must compile with the cuda feature in its own builder.
          grep -q 'AS builder-cuda' Dockerfile
          grep -q -- '--features server,cuda' Dockerfile
          grep -q 'COPY --from=builder-cuda' Dockerfile
          # All three runtime stages must drop privileges.
          test "$(grep -c '^USER sonicboom' Dockerfile)" -eq 3
          # No silent-failure library copies.
          if grep -q '|| true' Dockerfile; then
            echo "ERROR: Dockerfile contains '|| true'" >&2
            exit 1
          fi
          # Base images must be digest-pinned.
          test "$(grep -c '@sha256:' Dockerfile)" -ge 3
          # ONNX Runtime selection must be deterministic: no first-match picks.
          if grep -nE 'libonnxruntime.*(head|tail)' Dockerfile; then
            echo "ERROR: ambiguous ONNX Runtime library selection" >&2
            exit 1
          fi
          # No unquoted multi-file copies into the ORT staging dir.
          if grep -nE 'cp \$[A-Z_]+ /build/ort-dist' Dockerfile; then
            echo "ERROR: unquoted ORT staging copy" >&2
            exit 1
          fi
          # CUDA runtime must verify both provider libraries.
          grep -q 'libonnxruntime_providers_shared\.so' Dockerfile
          grep -q 'libonnxruntime_providers_cuda\.so' Dockerfile
          # Every runtime stage must fail on unresolved dynamic libraries.
          test "$(grep -c "grep.*'not found'" Dockerfile)" -ge 3
          # The final stage must be the headless CPU runtime so a plain
          # `docker build .` never produces a CUDA image by accident.
          test "$(grep '^FROM .* AS ' Dockerfile | tail -1 | awk '{print $NF}')" = "runtime"
          # Builders must share the runtime's libc generation (Ubuntu 24.04):
          # never build on a newer distro than the runtime.
          if grep -nE '^FROM rust:' Dockerfile; then
            echo "ERROR: builder must be Ubuntu 24.04-based, not rust:<debian>" >&2
            exit 1
          fi
          grep -q 'AS builder$' Dockerfile
          grep -q 'AS builder-playback' Dockerfile
          grep -q 'AS builder-cuda' Dockerfile

      - name: Production Compose must bind loopback by default
        run: |
          set -e
          # Every published backend port must default to 127.0.0.1 (explicit
          # BIND_ADDR override stays possible for intentional LAN exposure).
          test "$(grep -c 'BIND_ADDR:-127.0.0.1' docker-compose.yml)" -eq 3
          if grep -nE '"ports"|ports:' -A2 docker-compose.yml | grep -E '"[0-9]+:[0-9]+"'; then
            echo "ERROR: Compose publishes a backend port on all interfaces by default" >&2
            exit 1
          fi

  supply-chain-guards:
    name: Supply-chain guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py

      - name: No credential stores committed
        run: |
          set -e
          if git ls-files | grep -x 'tokens.json'; then
            echo "ERROR: tokens.json must not be committed" >&2
            exit 1
          fi
          if git ls-files | grep -E '^\.env$'; then
            echo "ERROR: .env must not be committed" >&2
            exit 1
          fi

      - name: Actions must be SHA-pinned
        run: |
          set -e
          # Every step `uses:` referencing an external action must pin a full 40-hex SHA.
          if grep -rnE '^[[:space:]]+- uses: ' .github/workflows | grep -vE 'uses: [^ ]+@[0-9a-f]{40}( #|$)'; then
            echo "ERROR: found non-SHA-pinned action reference" >&2
            exit 1
          fi

      - name: Git dependencies must be rev-pinned
        run: |
          set -e
          if grep -n 'branch *=' Cargo.toml; then
            echo "ERROR: Cargo git dependencies must pin 'rev', not 'branch'" >&2
            exit 1
          fi
