name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  KNF_STATIC_CRT: '0'
  SONICBOOM_FRONTEND_PREBUILT: '1'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: sonicboom-linux-x86_64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: sonicboom-windows-x86_64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify pinned native sources and manifests
        shell: bash
        run: python3 scripts/ci/preflight.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend once
        run: npm ci && npm run build
        working-directory: frontend
      - name: Test archive and checksum guards
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo dependencies (production-gui)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: production-gui-${{ matrix.target }}-${{ hashFiles('vendor/**') }}
          cache-bin: 'false'
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install pinned Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-vulkan.ps1

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev libopus-dev pkg-config cmake clang g++ libvulkan-dev vulkan-tools glslc spirv-headers
      - name: Confirm native dependency graph
        run: |
          cargo tree --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }} -i esaxx-rs
          cargo tree --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }} -i sonicboom-qwen-llama
      # ort/copy-dylibs can copy only beside the profile root when Windows
      # symlinks are unavailable (cache and checkout live on different drives).
      # Tests/examples must still resolve those DLLs without disabling tests.
      - name: Make Cargo-copied DLLs available to Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ github.workspace }}/target/${{ matrix.target }}/debug" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Test release feature combination (native linker regression)
        run: cargo test --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }}
      - name: Build release with GUI
        run: cargo build --release --locked --features gui,qwen-gguf-vulkan --target ${{ matrix.target }}
      - name: Package and inspect archive
        run: python scripts/release/package.py --target ${{ matrix.target }}
      - name: Smoke-test extracted package
        run: python scripts/release/smoke.py dist/${{ matrix.asset }}
      - name: Upload verified platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install packaging Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require tag on main and refuse an existing release
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tag must be on merged main'; exit 1; }
          python scripts/release/publish.py preflight
      - name: Download platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonicboom-*
          path: artifacts
          merge-multiple: true
      - name: Generate and verify final archive checksums
        run: |
          python scripts/release/package.py --checksums --output artifacts
          python scripts/release/package.py --checksums --verify --output artifacts
          cd artifacts
          sha256sum --check SHA256SUMS
      - name: Stage complete draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          files: |
            artifacts/sonicboom-linux-x86_64.tar.gz
            artifacts/sonicboom-windows-x86_64.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          draft: true
          prerelease: false
      - name: Verify uploaded draft assets before publication
        run: python scripts/release/publish.py verify
      - name: Publish verified draft
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify published assets and checksums
        run: python scripts/release/publish.py verify
